name: Topic Recipe context
on:
  pull_request:
    paths:
      - 'context/**'
      - 'vocab/v1/**'
      - 'schema/v1/topic-recipe-domain-card.json'
      - 'tests/topic-recipe/**'
      - '.github/workflows/topic-recipe-context.yml'
  push:
    branches: [main]
    paths:
      - 'context/**'
      - 'vocab/v1/**'
      - 'schema/v1/topic-recipe-domain-card.json'
      - 'tests/topic-recipe/**'
      - '.github/workflows/topic-recipe-context.yml'
permissions:
  contents: read
jobs:
  jsonld-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/topic-recipe/requirements.txt
      - run: python -B -m unittest discover -s tests/topic-recipe
